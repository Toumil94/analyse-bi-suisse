name: Mise à jour des données

on:
  schedule:
    - cron: "41 5 12 * *"   # chaque mois, après la publication des chiffres de l'OFS
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Extraire et modéliser les données OFS
        run: |
          set -o pipefail
          python pipeline/build.py 2>&1 | tee build.log || { echo "::error title=build::$(tail -c 3000 build.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=build::$(grep -E 'lignes' build.log | tr '\n' ' ')"
          echo "::notice title=controles::$(tr -d '\n' < data/controles.json | tr -s ' ')"

      - name: Contrôles qualité
        run: python -m pytest -q tests

      - name: Analyse et graphiques
        run: python pipeline/analyse.py

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/images analyse 2>/dev/null || true
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Données OFS du $(date -u +%F)"
          git push
