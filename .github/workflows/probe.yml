name: Exploration des sources

on:
  workflow_dispatch:
    inputs:
      tables:
        description: "Identifiants PX à explorer"
        default: "px-x-1003020000_101 px-x-1003020000_102 px-x-1003020000_103 px-x-1003020000_201 px-x-1003020000_202 px-x-1003020000_203"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python pipeline/probe.py ${{ github.event.inputs.tables }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Exploration des tables OFS" && git push
